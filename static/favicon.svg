<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!-- Listo logo: two crossed tags, i.e. one item with more than one category -->
	<rect width="64" height="64" rx="14" fill="#E4572E" />
	<g stroke-linejoin="round">
		<g transform="translate(30 25) rotate(-28) scale(0.9)">
			<path d="M-18 0 L-9 -10 H18 V10 H-9 Z" fill="#FFF4DC" stroke="#FFF4DC" stroke-width="3" />
			<circle cx="-8" cy="0" r="3" fill="#E4572E" />
		</g>
		<!-- the background-coloured stroke cuts a gap where the second tag overlaps the first -->
		<g transform="translate(35 40) rotate(8) scale(0.9)">
			<path
				d="M-18 0 L-9 -10 H18 V10 H-9 Z"
				fill="#FFC93C"
				stroke="#E4572E"
				stroke-width="7"
				paint-order="stroke"
			/>
			<circle cx="-8" cy="0" r="3" fill="#E4572E" />
		</g>
	</g>
</svg>
